<text x="54" y="226.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">• ABC, боковое положение, O₂, SpO₂,</text>
<text x="54" y="246.15" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">ЭКГ</text>
<text x="54" y="273.3" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">• Глюкоза крови; тиамин при</text>
