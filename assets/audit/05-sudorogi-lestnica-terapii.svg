<text x="831" y="634.4000000000001" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="start" opacity="1.0">• В/м диазепам НЕ рекомендуется (медленная, непредсказуемая абсорбция)</text>
<text x="831" y="659.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="start" opacity="1.0">• Без вены: мидазолам буккально / интраназально / в/м (0,1–0,2 мг/кг) или</text>
<text x="831" y="680.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="start" opacity="1.0">диазепам ректально 0,5 мг/кг (макс 20 мг)</text>
<text x="40" y="882.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#4b5563" text-anchor="start" opacity="1.0">Схема аудита 2026-10 к § 9.5.4, § 12.1.5, § 12.1.6, § 14.5. Дозы сверять с локальным протоколом и инструкцией к препарату.</text>
