<text x="442" y="326.45" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">• Нет вены: мидазолам в/м 10 мг (&gt; 40</text>
