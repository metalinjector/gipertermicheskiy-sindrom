<text x="830" y="320.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">• вальпроат 40 мг/кг (макс 3000 мг)</text>
<text x="830" y="347.75" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">• фосфенитоин 20 мг ФЭ/кг (макс</text>
<text x="830" y="367.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">1500 мг)</text>
<text x="830" y="395.05" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">Отечественные инструкции — ниже:</text>
<text x="830" y="415.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">вальпроат 15–30, леветирацетам</text>
<text x="830" y="435.35" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">20–60, фенитоин 15–20 мг/кг (≤ 50</text>
<text x="830" y="455.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">мг/мин, под ЭКГ и АД)</text>
