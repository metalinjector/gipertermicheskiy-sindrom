<text x="56" y="588.8000000000001" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="start" opacity="1.0">• «судорожная готовность», тремор, озноб и дрожь при охлаждении (дрожь</text>
<text x="56" y="609.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="start" opacity="1.0">лечат иначе — § 9.2.3)</text>
<text x="56" y="634.4000000000001" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="start" opacity="1.0">• уже закончившийся простой фебрильный приступ у ребёнка с</text>
