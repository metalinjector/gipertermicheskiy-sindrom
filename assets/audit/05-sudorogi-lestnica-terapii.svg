<text x="442" y="366.75" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">мг/кг; буккально 0,3–0,5 мг/кг;</text>
<text x="442" y="386.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">интраназально 0,2 мг/кг; диазепам</text>
<text x="442" y="407.05" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">ректально 0,5 мг/кг (макс 20 мг)</text>
<text x="442" y="434.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">• Повтор однократно через 5–10 мин</text>
