<text x="442" y="279.15" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15.5" fill="#1f2937" text-anchor="start" opacity="1.0">• Диазепам в/в 0,15–0,2 мг/кг (макс</text>
