<text x="56" y="680.0000000000001" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="start" opacity="1.0">• высокая температура сама по себе</text>
<rect x="815" y="525" width="745" height="230" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2.5" opacity="1.0"/>
