<text x="831" y="588.8000000000001" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="start" opacity="1.0">• В/в диазепам 0,1–0,2 мг/кг, макс 10 мг на введение; дозы 0,3–0,5 мг/кг в/в</text>
