<text x="800.0" y="52" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="34" fill="#1f2937" text-anchor="middle" font-weight="bold" opacity="1.0">Две модели терморегуляции: «установочная точка» и «точка равновесия»</text>
<text x="800.0" y="87.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19.040000000000003" fill="#4b5563" text-anchor="middle" opacity="1.0">классическая дидактическая схема (слева) и современное описание (справа): Romanovsky, 2007; Morrison &amp; Nakamura, 2019</text>
<rect x="40" y="105" width="740" height="640" rx="18" fill="#f3f4f6" stroke="#6b7280" stroke-width="3" opacity="1.0"/>
<text x="410" y="140" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold" opacity="1.0">Классическая модель: единая установочная точка</text>
<rect x="70" y="165" width="200" height="80" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5" opacity="1.0"/>
<text x="170.0" y="197.39999999999998" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" opacity="1.0">Терморецепторы</text>
<text x="170.0" y="218.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" opacity="1.0">кожи и ядра</text>
