# Конфигурация CodeRabbit.
#
# CodeRabbit в проекте не используется: пособие состоит из прозы, а не кода,
# и автопрогон на каждый push расходует платную квоту без соразмерной пользы.
#
# ВАЖНО: для открытых репозиториев CodeRabbit читает конфигурацию только из
# ветки по умолчанию, поэтому эти настройки вступят в силу после слияния
# в main. Гарантированно отключить бота можно, отвязав приложение CodeRabbit
# от репозитория: https://app.coderabbit.ai → Repositories, либо в GitHub
# Settings → Integrations → Applications.
#
# Полная схема: https://docs.coderabbit.ai/reference/yaml-template

reviews:
  auto_review:
    enabled: false
    drafts: false
  high_level_summary: false
  poem: false
  # Ничего не отдаётся на ревью даже при ручном запуске @coderabbitai review.
  path_filters:
    - "!**"

chat:
  auto_reply: false
